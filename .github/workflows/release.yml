name: Build and publish Steady

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            label: Linux-x86_64
          - runner: windows-latest
            label: Windows-x64
          - runner: macos-15
            label: macOS-Apple-Silicon
          - runner: macos-15-intel
            label: macOS-Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install build and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate public release metadata
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python packaging/check_release_metadata.py --require-contact --tag "$RELEASE_TAG"

      - name: Run test suite
        run: python -m pytest -q

      - name: Create macOS application icon
        if: runner.os == 'macOS'
        run: python packaging/create_macos_icon.py

      - name: Build native application bundle
        run: python packaging/build_app.py

      - name: Package release archive
        run: python packaging/package_release.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Steady-${{ matrix.label }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
